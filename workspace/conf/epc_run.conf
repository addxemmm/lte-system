[mme]
mme_code = 0x1a
mme_group = 0x0001
tac = 0x0007
mcc = 001
mnc = 01
mme_bind_addr = 127.0.1.100
apn = skygoapn
dns_addr = 8.8.8.8
paging_timer = 2

[hss]
db_file = /home/workspace/conf/user_db.csv

[spgw]
gtpu_bind_addr   = 127.0.1.100
sgi_if_addr      = 172.16.0.1
sgi_if_name      = srs_spgw_sgi
max_paging_queue = 100

[pcap]
enable   = true
filename = /home/workspace/log/srsLTE_epc.pcap

[log]
all_level = info
all_hex_limit = 32
filename = /home/workspace/log/srsLTE_epc.log
