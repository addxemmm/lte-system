name: release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify: credentials only; build: test image; publish: new release; resume: finish an interrupted upload'
        type: choice
        options: [verify, build, publish, resume]
        default: verify
        required: true
  push:
    tags: ['v*']

permissions:
  contents: read
defaults:
  run:
    shell: bash
# All publication runs are serialized; never cancel a partially uploaded release.
concurrency:
  group: lte-dockerhub-release
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
  RELEASE_MODE: ${{ github.event_name == 'push' && 'publish' || inputs.mode }}

jobs:
  verify:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      RELEASE_OUT: /tmp/lte-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact source, version and bilingual notes
        run: python3 scripts/release_metadata.py
      - name: Verify credentials, granted scopes and public repository (no upload)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/registry_check.py

  build:
    needs: verify
    if: github.event_name == 'push' || inputs.mode == 'build' || inputs.mode == 'publish'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      RELEASE_OUT: /tmp/lte-release
      TEST_IMAGE: lte-release-test:${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate source and run CPU-only regression gates
        id: metadata
        run: |
          python3 scripts/release_metadata.py
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./...
          python3 -m unittest discover -s scripts/tests -v
          bash -n scripts/*.sh deploy/docker/*.sh
          for board in firmware/uhd/*/; do (cd "$board" && sha256sum -c SHA256SUMS); done
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build full runtime; Dockerfile runs all seven CTests
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            OCI_VERSION=${{ steps.metadata.outputs.version }}
            OCI_REVISION=${{ steps.metadata.outputs.revision }}
            OCI_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=lte-full-release
          cache-to: type=gha,scope=lte-full-release,mode=max
      - name: Management-only image checks; no RF, USB, host ports or privileges
        run: python3 scripts/release_smoke.py
      - name: Package exact tested image and source evidence
        run: |
          mkdir -p "$RUNNER_TEMP/lte-image"
          docker image inspect "$TEST_IMAGE" --format '{{.Id}}' > "$RELEASE_OUT/tested-image-id.txt"
          git archive --format=tar.gz -o "$RELEASE_OUT/source.tar.gz" HEAD
          docker save "$TEST_IMAGE" | gzip -1 > "$RUNNER_TEMP/lte-image/image.tar.gz"
          sha256sum "$RUNNER_TEMP/lte-image/image.tar.gz" | awk '{print $1}' > "$RELEASE_OUT/image-archive.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: ${{ env.RELEASE_OUT }}/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-image
          path: ${{ runner.temp }}/lte-image/image.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [verify, build]
    if: >-
      always() && needs.verify.result == 'success' &&
      ((needs.build.result == 'success' && (github.event_name == 'push' || inputs.mode == 'publish')) ||
       (needs.build.result == 'skipped' && inputs.mode == 'resume'))
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_OUT: /tmp/lte-release
      TEST_IMAGE: lte-release-test:${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate publish source again
        run: python3 scripts/release_metadata.py
      - name: Download exact-run build artifacts
        if: env.RELEASE_MODE != 'resume'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-evidence --dir "$RUNNER_TEMP/lte-build-evidence"
          python3 -c 'import json,os,pathlib,shutil,sys; sys.path.insert(0,"scripts"); from release_publish import same_identity; src=pathlib.Path(os.environ["RUNNER_TEMP"])/"lte-build-evidence"; dst=pathlib.Path(os.environ["RELEASE_OUT"]); assert same_identity(json.loads((dst/"release.json").read_text()),json.loads((src/"release.json").read_text())), "build/source identity mismatch"; shutil.copytree(src,dst,dirs_exist_ok=True)'
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name tested-image --dir "$RUNNER_TEMP/lte-image"
          echo "$(cat "$RELEASE_OUT/image-archive.sha256")  $RUNNER_TEMP/lte-image/image.tar.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/lte-image/image.tar.gz" | docker load
          test "$(docker inspect --format '{{.Id}}' "$TEST_IMAGE")" = "$(cat "$RELEASE_OUT/tested-image-id.txt")"
      - name: Authenticate publisher
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish verified image and bilingual GitHub Release, or resume same digest
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/release_publish.py
