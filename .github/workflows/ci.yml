name: ci
permissions:
  contents: read
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      # Required by the embedded frontend's ES-module and API-client tests.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --version
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: bash -n scripts/*.sh deploy/docker/*.sh
      - run: GOOS=linux GOARCH=amd64 go build -o /tmp/lte-system ./cmd/server
