name: ci
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=linux GOARCH=amd64 go build -o /tmp/lte-system ./cmd/server
