openapi: 3.0.3
info:
  title: LTE-System Standard API
  version: 3.0.0
  description: >-
    UNRELEASED DRAFT: integrity additions have not completed final validation or deployment.
    Standard /api/v1 API only. Root-path legacy endpoints and singular
    /api/v1/ue were removed in v3.
servers:
  - url: http://HOST:8081
security:
  - {}
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Envelope:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { nullable: true }
        request_id: { type: string }
    FieldError:
      type: object
      required: [field, reason]
      properties:
        field: { type: string }
        reason: { type: string }
    CellStart:
      type: object
      properties:
        band: { type: string, enum: ['1','3','5','7','8','34','39','40','41'] }
        apn: { type: string }
        apn_mismatch_policy: { type: string, enum: [strict, restricted], default: strict, description: 'Unreleased: strict rejects an explicit mismatch; restricted retains AKA and admits a restricted default bearer with bidirectional SPGW drops. Inherited and persisted with the profile.' }
        mcc: { type: string, pattern: '^[0-9]{3}$' }
        mnc: { type: string, pattern: '^[0-9]{2,3}$' }
        network: { type: string, default: auto, description: 'auto resolves the current namespace default route' }
        dns: { type: string, format: ipv4 }
        ue_subnet: { type: string, default: 172.16.0.0/24, description: 'RFC1918 /24 SGi subnet for one configured APN; restricted mode separates normal/restricted address classes within it.' }
        ue_access: { type: string, enum: [isolated, allow], default: isolated }
        sdr: { type: string, enum: [auto, uhd, bladerf, zmq] }
        device_args: { type: string }
        tx_gain: { type: integer, minimum: 0, maximum: 90 }
        rx_gain: { type: integer, minimum: 0, maximum: 90 }
        n_prb: { type: integer, enum: [6,15,25,50,75,100] }
        full_net_name: { type: string }
        short_net_name: { type: string }
      description: '{} reuses the complete saved profile; explicit fields override it.'
    NetworkPlan:
      type: object
      required: [active, ue_subnet, sgi_address, ue_access]
      properties:
        active: { type: boolean, description: 'Whether this Manager currently has an effective UE network plan' }
        ue_subnet: { type: string, example: 172.16.0.0/24 }
        sgi_address: { type: string, format: ipv4, example: 172.16.0.1 }
        ue_access: { type: string, enum: [isolated, allow] }
        resolved_network: { type: string, description: 'Present after an active plan resolves its egress interface' }
      description: 'Configuration snapshot only; it does not assert Internet or DNS reachability.'
    CaptureMetadata:
      type: object
      required: [state]
      properties:
        state: { type: string }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        modified_at: { type: string, format: date-time }
        session_relation: { type: string }
        snapshot_size_bytes: { type: integer, format: int64, minimum: 0 }
        complete_packets: { type: integer, format: int64, minimum: 0 }
        incomplete: { type: boolean }
        tail_incomplete: { type: boolean, description: 'A partial header or final record was observed; this does not identify its cause.' }
        source_changed: { type: boolean, description: 'File identity or metadata changed during inspection. False or omitted is not an atomic snapshot guarantee.' }
        trailing_bytes: { type: integer, format: int64, minimum: 0, description: 'Bytes excluded after the last complete record when framing inspection succeeds; not a dropped-packet count.' }
      description: 'Metadata only. A private complete-record prefix is removed after inspection; the original capture is unchanged.'
    ProtocolObservation:
      type: object
      required: [state, reason, capture, s1ap_observed, chap_observed, pap_observed, scan_complete]
      properties:
        state: { type: string, enum: [not_collected, unavailable, not_checked, unknown, observed, not_observed] }
        reason: { type: string, description: 'Includes capture_incomplete, capture_format_invalid, capture_linktype_unsupported, capture_no_packets, capture_read_failed, inspection_timeout, inspection_cancelled, tshark_incompatible and pap_frames_observed.' }
        capture: { $ref: '#/components/schemas/CaptureMetadata' }
        s1ap_observed: { type: boolean }
        chap_observed: { type: boolean }
        pap_observed: { type: boolean }
        scan_complete: { type: boolean }
        limitations: { type: array, items: { type: string } }
      description: 'Protocol presence only, with no identities or credentials. An incomplete negative scan does not prove absence; presence does not prove a complete handshake or recovered password.'
    ConnectivityEvidence:
      type: object
      required: [registration, pdn, chap, user_plane, dns, network]
      properties:
        registration: { type: object }
        pdn: { type: object }
        chap: { $ref: '#/components/schemas/ProtocolObservation' }
        user_plane: { type: object }
        dns: { type: object }
        network: { type: object }
    Bearer:
      type: object
      required: [ebi, qci, state]
      properties:
        ebi: { type: integer, minimum: 5, maximum: 15 }
        qci: { type: integer, minimum: 0, maximum: 9, description: '0 means not known yet and is allowed only for deactivated/requested bearers' }
        state: { type: string, enum: [deactivated, requested, setup, active] }
    UESessionBase:
      type: object
      required: [session_id, mme_ue_s1ap_id, enb_ue_s1ap_id, sctp_assoc_id, emm_state, ecm_state, apn_source, apn_validated, bearers]
      properties:
        session_id: { type: string, maxLength: 128 }
        imsi: { type: string, pattern: '^[0-9]{15}$', description: 'Absent before authoritative identity association' }
        mme_ue_s1ap_id: { type: integer, minimum: 0 }
        enb_ue_s1ap_id: { type: integer, minimum: 0 }
        sctp_assoc_id: { type: integer, format: int32 }
        emm_state: { type: string, enum: [deregistered, common_procedure_initiated, registered, deregistered_initiated] }
        ecm_state: { type: string, enum: [idle, connected] }
        ue_ipv4: { type: string, format: ipv4 }
        requested_apn: { type: string, maxLength: 99 }
        apn_source: { type: string, enum: [omitted, pdn_request, esm_information_response] }
        selected_apn: { type: string, maxLength: 99 }
        apn_validated: { type: boolean }
        access_policy: { type: string, enum: [normal, restricted, deny] }
        access_reason: { type: string, enum: [apn_match, apn_omitted, apn_mismatch, session_unavailable] }
        bearers:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/Bearer' }
    UESessionV1:
      allOf:
        - $ref: '#/components/schemas/UESessionBase'
        - not:
            anyOf:
              - required: [access_policy]
              - required: [access_reason]
      description: 'Legacy session contract; policy fields are absent and a selected APN requires apn_validated=true.'
    UESessionV2:
      allOf:
        - $ref: '#/components/schemas/UESessionBase'
        - required: [access_policy, access_reason]
          oneOf:
            - required: [selected_apn]
              properties:
                access_policy: { enum: [normal] }
                access_reason: { enum: [apn_match, apn_omitted] }
                apn_validated: { enum: [true] }
                selected_apn: { type: string, minLength: 1 }
            - required: [requested_apn, selected_apn]
              properties:
                access_policy: { enum: [restricted] }
                access_reason: { enum: [apn_mismatch] }
                apn_validated: { enum: [false] }
                apn_source: { enum: [pdn_request, esm_information_response] }
                requested_apn: { type: string, minLength: 1 }
                selected_apn: { type: string, minLength: 1 }
            - properties:
                access_policy: { enum: [deny] }
                access_reason: { enum: [session_unavailable] }
                apn_validated: { enum: [false] }
                selected_apn: { type: string, maxLength: 0 }
      description: 'Policy is confirmed by SPGW before normal/restricted is published. Restricted APNs must differ case-insensitively from selected_apn; normal APN source/reason must agree. Runtime additionally checks these cross-field relationships.'
    UESession:
      oneOf:
        - $ref: '#/components/schemas/UESessionV1'
        - $ref: '#/components/schemas/UESessionV2'
    UESnapshotData:
      type: object
      required: [state, sessions, count]
      properties:
        state: { type: string, enum: [current, missing, stale, invalid, cell_stopped] }
        cell_state: { type: string, enum: [running] }
        reason: { type: string }
        schema_version: { type: integer, enum: [1, 2] }
        run_id: { type: string }
        sequence: { type: integer, format: int64 }
        started_at_unix_ms: { type: integer, format: int64 }
        updated_at_unix_ms: { type: integer, format: int64 }
        count: { type: integer, minimum: 0, maximum: 256 }
        sessions:
          type: array
          maxItems: 256
          items: { $ref: '#/components/schemas/UESession' }
      oneOf:
        - required: [schema_version]
          properties:
            state: { enum: [current] }
            schema_version: { enum: [1] }
            sessions: { type: array, items: { $ref: '#/components/schemas/UESessionV1' } }
        - required: [schema_version]
          properties:
            state: { enum: [current] }
            schema_version: { enum: [2] }
            sessions: { type: array, items: { $ref: '#/components/schemas/UESessionV2' } }
        - properties:
            state: { enum: [missing, stale, invalid, cell_stopped] }
          not: { required: [schema_version] }
    Subscriber:
      type: object
      required: [name, auth, imsi, op_type, qci, ip_alloc, authorized, active, credential_status]
      properties:
        name: { type: string }
        auth: { type: string, enum: [mil, xor] }
        imsi: { type: string, pattern: '^[0-9]{15}$' }
        op_type: { type: string, enum: [op, opc] }
        qci: { type: integer, minimum: 1, maximum: 9 }
        ip_alloc: { type: string }
        authorized: { type: boolean, enum: [true] }
        active: { type: boolean, nullable: true, description: 'true iff a current authoritative snapshot has EMM registered for this IMSI; null when no safe join is available' }
        credential_status: { type: string, enum: [configured] }
    SubscriberCreate:
      type: object
      additionalProperties: false
      required: [name, auth, imsi, key, amf, sqn, qci, ip_alloc]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
        auth: { type: string, enum: [mil, xor] }
        imsi: { type: string, pattern: '^[0-9]{15}$' }
        key: { type: string, pattern: '^[0-9A-Fa-f]{32}$', writeOnly: true }
        op_type: { type: string, enum: [op, opc] }
        op: { type: string, pattern: '^[0-9A-Fa-f]{32}$', writeOnly: true }
        opc: { type: string, pattern: '^[0-9A-Fa-f]{32}$', writeOnly: true }
        amf: { type: string, pattern: '^[0-9A-Fa-f]{4}$', writeOnly: true }
        sqn: { type: string, pattern: '^[0-9A-Fa-f]{12}$', writeOnly: true }
        qci: { type: integer, minimum: 1, maximum: 9 }
        ip_alloc: { type: string, enum: [dynamic] }
      oneOf:
        - required: [op]
        - required: [opc]
      description: 'name and imsi must each be unique; responses never echo writeOnly fields'
    SubscriberPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
        qci: { type: integer, minimum: 1, maximum: 9 }
        ip_alloc: { type: string, enum: [dynamic] }
    SIMProgram:
      type: object
      required: [imsi]
      properties:
        imsi: { type: string, pattern: '^[0-9]{15}$' }
        mcc: { type: string }
        mnc: { type: string }
        ki: { type: string, writeOnly: true }
        op: { type: string, writeOnly: true }
        opc: { type: string, writeOnly: true }
        op_type: { type: string, enum: [op, opc] }
        auth: { type: string, enum: [mil, xor] }
        amf: { type: string }
        acc: { type: string }
        sqn: { type: string, writeOnly: true }
        name: { type: string }
        qci: { type: integer }
        spn: { type: string }
        card: { type: string }
paths:
  /api/v1/cell:
    post:
      summary: Start the cell; {} inherits the saved profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CellStart' }
      responses:
        '200': { description: Cell started }
        '409': { description: Already running }
        '422': { description: Validation failed }
        '503': { description: SDR unavailable }
    get:
      summary: Manager-owned cell state and resolved network
      responses:
        '200': { description: Current state }
    delete:
      summary: Idempotently stop the cell
      responses:
        '200': { description: Stopped or already stopped }
  /api/v1/network:
    get:
      summary: Read the current effective UE network plan without probing or mutation
      responses:
        '200':
          description: Manager network configuration snapshot only
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NetworkPlan' }
  /api/v1/ues:
    get:
      summary: Bounded authoritative multi-UE snapshot
      description: >-
        Reads the EPC's atomic once-per-second schema-v1/v2 telemetry. Only a matching
        run_id/PID snapshot no older than five seconds is current. Missing/stale/
        invalid/cell_stopped states carry sessions=[] and never fall back to log joins.
      responses:
        '200':
          description: Current sessions or an explicit no-current-snapshot state
  /api/v1/ues/{imsi}:
    parameters:
      - in: path
        name: imsi
        required: true
        schema: { type: string, pattern: '^[0-9]{15}$' }
    get:
      summary: One current UE session by authoritative IMSI association
      responses:
        '200': { description: Session, or explicit no-current-snapshot state }
        '404': { description: Complete current snapshot proves IMSI absent }
        '422': { description: Invalid IMSI }
  /api/v1/subscribers:
    get:
      summary: List redacted authorized subscribers
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: Paginated redacted subscriber list }
        '422': { description: Invalid pagination }
        '500': { description: Existing database is invalid }
    post:
      summary: Create one subscriber while the cell is stopped
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriberCreate' }
      responses:
        '201': { description: Created; response is redacted }
        '409': { description: Cell running or IMSI already exists }
        '422': { description: Validation failed }
  /api/v1/subscribers/{imsi}:
    parameters:
      - in: path
        name: imsi
        required: true
        schema: { type: string, pattern: '^[0-9]{15}$' }
    get:
      summary: Read one redacted subscriber
      responses:
        '200': { description: Redacted subscriber }
        '404': { description: Not found }
        '422': { description: Invalid IMSI }
    patch:
      summary: Update non-authentication metadata while stopped
      description: Authentication fields and SQN are rejected and never overwritten.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriberPatch' }
      responses:
        '200': { description: Updated; response is redacted }
        '404': { description: Not found }
        '409': { description: Cell must be stopped or subscriber name already exists }
        '422': { description: Validation or protected-field error }
    delete:
      summary: Delete subscriber authorization while stopped; does not disconnect a UE
      responses:
        '200': { description: Deleted with disconnected=false }
        '404': { description: Not found }
        '409': { description: Cell must be stopped }
        '422': { description: Invalid IMSI }
  /api/v1/diagnostics/connectivity:
    get:
      summary: Read-only layered connectivity evidence
      responses:
        '200':
          description: 'Partial or complete read-only evidence; live capture truncation is not absence of authentication.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ConnectivityEvidence' }
        '429': { description: diagnostic_busy }
  /api/v1/crack/jobs:
    post:
      summary: Audit own-device APN password strength (PAP instant verdict, else CHAP hashcat job; stops the cell only for CHAP)
      description: >-
        Empty body preserves the legacy capture-wide call without ownership verification. A targeted audit sends
        {"imsi":"15 digits","confirm_ownership":true}; imsi must already be an authorized
        subscriber or the call returns 404; database failures return 500. Even a known IMSI returns
        412 because reliable per-UE credential binding is unavailable, without extracting
        credentials, stopping the cell or starting a job. Legacy success always reports
        ownership_verified=false. Complete-record snapshots do not resolve CHAP identifier
        reuse or prove credential ownership. EPC log contributes only
        APN name/IMSI/IP enrichment (aggregate-only); the APN username and password hash
        come from a bounded immutable S1AP snapshot via tshark. PAP needs no cracking;
        CHAP uses hashcat -m 4800 dictionary attack. Dictionary hits return weak:true with
        the password; no hit is 404 no_password, not proof of strength.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                imsi: { type: string, pattern: '^[0-9]{15}$', description: 'Owned subscriber IMSI already authorized in this cell' }
                confirm_ownership: { type: boolean, description: 'Must be true when imsi is present; no third-party auditing' }
      responses:
        '200': { description: PAP plaintext recovered (no cracking needed, cell untouched) }
        '202': { description: CHAP job accepted }
        '400': { description: Malformed JSON body }
        '404': { description: Owned IMSI is not an authorized subscriber }
        '409': { description: Job conflict }
        '412': { description: Target binding unavailable or no suitable handshake/capture/wordlist }
        '500': { description: Subscriber database read failed }
        '413': { description: Consent body exceeds limit }
        '422': { description: Consent validation failed or capture cannot be interpreted }
        '503': { description: Decoder unavailable }
  /api/v1/crack/result:
    get:
      summary: Poll crack job result (PAP verdict or CHAP password when weak)
      parameters:
        - in: query
          name: imsi
          required: false
          schema: { type: string, pattern: '^[0-9]{15}$' }
          description: 'Optional target; unknown subscriber returns 404, database failure 500, known target 412 until per-UE credential binding exists'
      responses:
        '200': { description: running or ready }
        '404': { description: Result not found or owned IMSI unknown }
        '412': { description: Target binding unavailable; no credentials returned }
        '422': { description: Invalid target IMSI }
        '500': { description: Subscriber database read failed }
  /api/v1/config/subscribers:
    post:
      summary: Validate and replace user_db.csv while stopped, preserving existing SQNs
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [userdb]
              properties:
                userdb: { type: string, format: binary }
      responses:
        '200': { description: Replaced; sqn_policy=preserved_for_existing_imsi }
        '409': { description: Cell must be stopped }
        '413': { description: Upload exceeds limit }
        '422': { description: Missing file or invalid CSV }
        '500': { description: Existing database or atomic replacement failed }
  /api/v1/config/wordlist:
    post:
      summary: Atomically replace the crack dictionary
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [wordlist]
              properties:
                wordlist: { type: string, format: binary }
      responses:
        '200': { description: Uploaded }
        '413': { description: Upload exceeds limit }
        '422': { description: Missing file }
  /api/v1/captures/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, enum: [lte-data, s1ap, enb, epc] }
    get:
      summary: Download an existing capture
      responses:
        '200': { description: Capture file }
        '404': { description: Unknown id or file not ready }
  /api/v1/simcards:
    post:
      summary: Program a SIM and append its subscriber row while stopped
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SIMProgram' }
      responses:
        '200': { description: Programmed }
        '409': { description: Cell running or card already exists }
        '412': { description: No card inserted }
        '422': { description: Validation failed }
        '503': { description: Reader unavailable }
  /api/v1/profile:
    get:
      summary: Saved launch profile only; subscribers and sessions are separate resources
      responses:
        '200': { description: has_profile and optional profile }
  /api/v1/health:
    get:
      summary: API health, Manager running state and SDR detection
      responses:
        '200': { description: Health snapshot }
