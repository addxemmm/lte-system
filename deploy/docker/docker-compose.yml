# lte-system compose (Ubuntu SDR host with USRP/bladeRF + ACR1281U attached)
# Host-network compatibility/rollback option. For isolated eth0 networking use
# docker-compose.bridge.yml by itself (do not merge the two files).
# USB passthrough is REQUIRED for USRP + smartcard reader.
services:
  lte-system:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ${LTE_IMAGE:-ltesystem-dep:3.0}
    container_name: ltesystem
    network_mode: host
    privileged: true
    # 手动启停：不开机自启、不自动重启。需要随开机自启时再改回 unless-stopped。
    # Manual start/stop: no auto-start on boot, no auto-restart.
    restart: "no"
    # Let an in-flight SIM request (180s maximum) finish during shutdown.
    stop_grace_period: 210s
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - lte-data:/data
    environment:
      LTE_CONFIG: /app/configs/app.yaml
      # Listen on all IPv4 interfaces for LAN clients; an optional token is forwarded below.
      LTE_LISTEN: ${LTE_LISTEN:-0.0.0.0:8081}
      LTE_API_TOKEN: ${LTE_API_TOKEN:-}
      # UHD_FPGA: stock | compat | auto
      # Use "compat" for the BlackSDR/clone B210 whose FPGA differs from Ettus stock.
      UHD_FPGA: compat
      UHD_IMAGES_DIR: /usr/share/uhd/images
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  lte-data:
