# Isolated all-in-one EPC/eNB; requires Docker Compose >= 2.36.0.
# Use this base file alone, not as an override of docker-compose.yml. Add only
# docker-compose.test.yml when direct test access to the API is required.
services:
  lte-system:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        OCI_VERSION: ${LTE_VERSION:-2.1}
        OCI_REVISION: ${LTE_REVISION:-unknown}
    image: ${LTE_IMAGE:-ltesystem-dep:2.1}
    container_name: ltesystem
    privileged: true
    restart: "no"
    stop_grace_period: 210s
    networks:
      lte-uplink:
        interface_name: eth0
    sysctls:
      net.ipv4.ip_forward: "1"
    ports:
      - "${LTE_UI_PORT:-8080}:8080"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - lte-data:/data
    environment:
      LTE_CONFIG: /app/configs/app.yaml
      # The Web UI and its limited same-origin management gateway use this port.
      LTE_UI_LISTEN: 0.0.0.0:8080
      # Strict boolean; the test override changes this to true and publishes 8081.
      LTE_EXPOSE_API: "false"
      LTE_LISTEN: 0.0.0.0:8081
      LTE_API_TOKEN: ${LTE_API_TOKEN:-}
      UHD_FPGA: compat
      UHD_IMAGES_DIR: /usr/share/uhd/images
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  lte-uplink:
    driver: bridge
    ipam:
      config:
        # Must not overlap the UE pool (172.16.0.0/24), LAN, VPN or other bridges.
        - subnet: ${LTE_BRIDGE_SUBNET:-172.30.8.0/24}

volumes:
  lte-data:
